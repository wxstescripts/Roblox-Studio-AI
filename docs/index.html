<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pet Mining Empire — Development Documentation & Control Center</title>
    <style>
        body {
            background-color: #0A0D13;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #11151F;
            border: 1px solid #263042;
            border-radius: 12px;
            padding: 36px;
            max-width: 560px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 { color: #00DCFF; font-size: 26px; margin-bottom: 12px; }
        p { color: #90A0B5; margin-bottom: 28px; font-size: 14px; line-height: 1.5; }
        .nav-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            background: #161C27;
            color: #FFFFFF;
            border: 1px solid #263042;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        a:hover {
            border-color: #00DCFF;
            transform: translateY(-2px);
        }
        a.primary {
            background: #00DCFF;
            color: #000;
            border-color: #00DCFF;
        }
        a.accent {
            background: #FFCC00;
            color: #000;
            border-color: #FFCC00;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⛏ Pet Mining Empire</h1>
        <p>Official development architecture, evidence review gallery, and remote task prompt control portal.</p>
        <div class="nav-links">
            <a href="review-gallery/index.html">📷 Screenshot Gallery</a>
            <a href="reports/index.html" class="accent">📄 Task Reports</a>
            <a href="control-center/index.html" class="primary">⚡ Prompt Control Center</a>
        </div>
    </div>
</body>
</html>
